services:
  # Puertos 5434/6381 para no chocar con agent-platform (5433/6380).
  postgres:
    image: postgres:17-alpine
    container_name: life-os-db
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: life_os
    ports:
      - '5434:5432'
    volumes:
      - life-os-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d life_os']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: life-os-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6381:6379'
    volumes:
      - life-os-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  life-os-db:
  life-os-redis:
